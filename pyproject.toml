[project]
name = "push-to-whisper"
version = "0.1.1"
description = "Yet another voice memo tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.2",
    "requests>=2.32.5",
    "scipy>=1.17.0",
    "sounddevice>=0.5.5",
    "pydbus>=0.6.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "pygobject>=3.48.0",
    "apprise>=1.9.7",
    "litellm>=1.81.12",
    "patch-ng>=1.19.0",
    "jinja2>=3.1.6",
    "platformdirs>=4.9.2",
    "faster-whisper>=1.2.1",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]

[project.optional-dependencies]
dbus = [
    "dbus-python>=1.3.2",
    "PySide6>=6.8.1",
]

[project.scripts]
push-to-whisper = "push_to_whisper.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.analysis]
allowed-unresolved-imports = ["gi.**", "pydbus.**"]

[tool.ty.rules]
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]

